name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  VERSION: 1.0.0-ci

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: make verify

  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: make release VERSION="$VERSION"
      - run: tar -tzf "dist/when-server-$VERSION.tgz" >/dev/null
      - run: tar -tzf "dist/when-admin-web-$VERSION.tgz" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: when-release-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: make image VERSION="$VERSION" IMAGE_REPO=whenproject/when
      - run: test "$(docker image inspect whenproject/when:$VERSION --format '{{.Config.User}}')" = "10001:10001"

  k8s-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - run: make k8s-validate

  security:
    runs-on: ubuntu-24.04
    needs: [release, image, k8s-validate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: azure/setup-kubectl@v4
      - run: make release VERSION="$VERSION"
      - run: test -s dist/checksums.txt
      - run: test -s "dist/sbom/when-server-$VERSION.cdx.json"
      - run: test -s "dist/sbom/when-admin-web-$VERSION.cdx.json"
      - run: |
          test -z "$(kubectl kustomize deploy/k8s/base | sed -n '/^kind: Secret$/p')"
