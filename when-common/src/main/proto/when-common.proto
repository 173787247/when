syntax = "proto3";

package when.v1;

option java_multiple_files = true;
option java_package = "com.when.common.proto";
option java_outer_classname = "WhenCommonProto";

enum SinkType {
  SINK_TYPE_UNSPECIFIED = 0;
  HTTP = 1;
  KAFKA = 2;
  FILE = 3;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  DELIVERING = 2;
  DELIVERED = 3;
  FAILED = 4;
  CANCELLED = 5;
}

message HttpSinkConfig {
  string url = 1;
  string method = 2;
  map<string, string> headers = 3;
  int32 timeout_ms = 4;
}

message KafkaSinkConfig {
  string bootstrap_servers = 1;
  string topic = 2;
  string key = 3;
  map<string, string> headers = 4;
}

message FileSinkConfig {
  string path = 1;
}

message SinkConfig {
  oneof config {
    HttpSinkConfig http = 1;
    KafkaSinkConfig kafka = 2;
    FileSinkConfig file = 3;
  }
}
