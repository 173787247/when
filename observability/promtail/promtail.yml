server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: when
    static_configs:
      - targets: [localhost]
        labels:
          job: when
          __path__: /var/log/when/*.json
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            node_id: node_id
            event: event
            trace_id: trace_id
      - labels:
          level:
          service:
          node_id:
          event:
