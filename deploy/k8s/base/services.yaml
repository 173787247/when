apiVersion: v1
kind: Service
metadata:
  name: when-headless
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: when
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: when-api
spec:
  selector:
    app.kubernetes.io/name: when
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: when-management
  annotations:
    when.io/exposure: trusted-management-network-only
spec:
  selector:
    app.kubernetes.io/name: when
  ports:
    - name: management
      port: 8081
      targetPort: management
