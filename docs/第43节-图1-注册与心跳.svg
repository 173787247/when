<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="380" fill="#ffffff"/>
  <defs>
    <marker id="r1-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="r1-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="r1-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 1　节点注册 + 心跳保活：靠 Lease 实现“宕机自动下线”</text>

  <!-- node -->
  <rect x="40" y="120" width="180" height="70" rx="9" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="middle">节点 node-1</text>
  <text x="130" y="172" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">独立线程每 2s 续约</text>

  <!-- etcd -->
  <rect x="620" y="110" width="200" height="90" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="720" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">ETCD</text>
  <text x="720" y="162" font-family="Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">/when/nodes/node-1</text>
  <text x="720" y="182" font-family="Arial, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">value + Lease(TTL 6s)</text>

  <!-- register arrow -->
  <line x1="220" y1="140" x2="618" y2="140" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#r1-amber)"/>
  <text x="300" y="130" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309">① 注册：PutWithLease</text>

  <!-- heartbeat arrow -->
  <line x1="220" y1="172" x2="618" y2="172" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#r1-green)"/>
  <text x="300" y="192" font-family="Arial, sans-serif" font-size="11.5" fill="#15803d">② 心跳：每 2s KeepAlive 续约</text>

  <!-- crash scenario -->
  <rect x="40" y="255" width="180" height="60" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="130" y="280" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#c0392b" text-anchor="middle">节点宕机</text>
  <text x="130" y="300" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">续约停止</text>

  <line x1="220" y1="285" x2="618" y2="250" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#r1-red)"/>
  <text x="300" y="262" font-family="Arial, sans-serif" font-size="11.5" fill="#c0392b">③ 约 6s Lease 过期 → key 自动删除</text>

  <rect x="620" y="235" width="200" height="60" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="720" y="262" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">key 消失</text>
  <text x="720" y="282" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">其他节点立刻可感知</text>

  <text x="20" y="352" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Lease TTL 6s；续约用独立线程 + 独立连接，给 10s 总切换预算预留恢复时间。</text>
</svg>
