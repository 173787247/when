<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="420" fill="#ffffff"/>
  <defs>
    <marker id="d1-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="d1-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 1　一个提示词：先开发 Runner，再跑完第一阶段</text>

  <!-- raw materials -->
  <rect x="25" y="60" width="250" height="200" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="150" y="84" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#4338ca" text-anchor="middle">唯一提示词 + 课程原料</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
    <text x="45" y="110">39 公共契约：模型 + 契约</text>
    <text x="45" y="134">40 gRPC 契约</text>
    <text x="45" y="158">41 存储 / Redis</text>
    <text x="45" y="182">42 元数据 / ETCD</text>
    <text x="45" y="206">43 节点集群</text>
    <text x="45" y="230">44 时间轮　45 接入/路由与整合</text>
  </g>

  <!-- harness -->
  <rect x="305" y="60" width="250" height="200" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="430" y="84" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">先在 lesson/46 开发 Runner</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
    <text x="325" y="110">生成 AGENTS.md + loop.yaml</text>
    <text x="325" y="134">生成 Python Runner + Adapter</text>
    <text x="325" y="158">生成受保护 Harness 与本地依赖脚本</text>
    <text x="325" y="182">Runner 自测 + validate + plan</text>
    <text x="325" y="206">提交 lesson/46 并合并 master</text>
    <text x="325" y="230">同一 Codex 任务继续，不等待确认</text>
  </g>

  <!-- loop run -->
  <rect x="620" y="90" width="215" height="140" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2.4"/>
  <text x="727" y="118" font-family="Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#15803d" text-anchor="middle">执行 ./loop run</text>
  <text x="727" y="144" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">读取第 39—45 节原料</text>
  <text x="727" y="164" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">实现 → 测试 → 修正</text>
  <text x="727" y="184" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">提交并合并 master</text>
  <text x="727" y="210" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">下一节从最新 master 建分支</text>

  <line x1="275" y1="160" x2="303" y2="160" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#d1-amber)"/>
  <line x1="555" y1="160" x2="618" y2="160" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#d1-amber)"/>

  <!-- result -->
  <rect x="180" y="300" width="500" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="430" y="326" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">本次验收结果（第七周范围）</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="11" fill="#334155">✓ 单机：Submit → 持久化 → 时间轮 → 测试到期处理 → Query 验证状态</text>
  <text x="200" y="372" font-family="Arial, sans-serif" font-size="11" fill="#334155">✓ 集群：三节点注册 · 唯一 Controller · 节点停止后收到离线事件</text>
  <line x1="727" y1="230" x2="600" y2="298" stroke="#22c55e" stroke-width="2.2" marker-end="url(#d1-green)"/>
</svg>
