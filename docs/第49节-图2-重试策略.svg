<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="380" fill="#ffffff"/>
  <defs>
    <marker id="sk2-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="sk2-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="sk2-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 2　统一重试：按 DeliveryResult 区分可重试 / 不可重试</text>

  <!-- deliver -->
  <rect x="40" y="90" width="150" height="60" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="115" y="118" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">Sink.deliver()</text>
  <text x="115" y="138" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">→ DeliveryResult</text>

  <!-- success -->
  <rect x="270" y="55" width="200" height="52" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="370" y="80" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">success</text>
  <text x="370" y="98" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">→ DELIVERED，删 Redis</text>
  <line x1="190" y1="108" x2="268" y2="85" stroke="#22c55e" stroke-width="2" marker-end="url(#sk2-green)"/>

  <!-- retryable -->
  <rect x="270" y="120" width="200" height="52" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="145" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#b45309" text-anchor="middle">retryable（HTTP 5xx/网络）</text>
  <text x="370" y="163" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">→ 回时间轮，等下次重试</text>
  <line x1="190" y1="120" x2="268" y2="140" stroke="#f59e0b" stroke-width="2" marker-end="url(#sk2-amber)"/>

  <!-- not retryable -->
  <rect x="270" y="185" width="200" height="52" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="370" y="210" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#c0392b" text-anchor="middle">不可重试（HTTP 4xx）</text>
  <text x="370" y="228" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">→ 直接 FAILED</text>
  <line x1="190" y1="135" x2="268" y2="205" stroke="#c0392b" stroke-width="2" marker-end="url(#sk2-red)"/>

  <!-- backoff -->
  <rect x="540" y="120" width="295" height="52" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="687" y="143" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#4338ca" text-anchor="middle">指数退避：30s → 1m → 2m → 4m → 8m</text>
  <text x="687" y="161" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">最多 5 次，封顶 30 分钟</text>
  <line x1="470" y1="146" x2="538" y2="146" stroke="#f59e0b" stroke-width="2" marker-end="url(#sk2-amber)"/>

  <!-- exhausted -->
  <rect x="540" y="200" width="295" height="46" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="687" y="228" font-family="Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">超过 5 次 → FAILED（Redis 保留供排查）</text>
  <line x1="687" y1="172" x2="687" y2="198" stroke="#c0392b" stroke-width="1.8" marker-end="url(#sk2-red)"/>

  <rect x="40" y="285" width="795" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="58" y="309" font-family="Arial, sans-serif" font-size="11.5" fill="#334155"><tspan font-weight="bold">HTTP：</tspan>2xx=成功；5xx/超时/连接失败=可重试；4xx=不可重试（业务方参数错，得改）。</text>
  <text x="58" y="333" font-family="Arial, sans-serif" font-size="11.5" fill="#334155"><tspan font-weight="bold">Kafka：</tspan>send 成功=成功；任何异常=可重试。Producer 按 bootstrap_servers 缓存复用。</text>
</svg>
