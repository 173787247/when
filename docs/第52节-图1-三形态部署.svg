<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 1　三种部署形态：本地开发 / 单机生产 / Kubernetes</text>

  <g font-family="Arial, sans-serif">
    <!-- 本地 -->
    <rect x="25" y="65" width="255" height="240" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="152" y="92" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">本地开发</text>
    <text x="152" y="112" font-size="10.5" fill="#64748b" text-anchor="middle">docker-compose 一键起</text>
    <text x="42" y="140" font-size="10.5" fill="#334155">ETCD + Redis + Kafka</text>
    <text x="42" y="162" font-size="10.5" fill="#334155">when-1 / when-2 / when-3</text>
    <text x="42" y="184" font-size="10.5" fill="#334155">测试/真实 Sink 端点</text>
    <text x="42" y="212" font-size="10.5" fill="#334155">学员 curl / SDK 直接测</text>
    <text x="42" y="234" font-size="10.5" fill="#334155">演示也用这套</text>
    <text x="42" y="270" font-size="10" fill="#94a3b8">3 节点集群 + 依赖，</text>
    <text x="42" y="286" font-size="10" fill="#94a3b8">一条命令起来</text>

    <!-- 单机生产 -->
    <rect x="300" y="65" width="255" height="240" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="427" y="92" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">单机生产</text>
    <text x="427" y="112" font-size="10.5" fill="#64748b" text-anchor="middle">jar / docker run + Nginx</text>
    <text x="317" y="140" font-size="10.5" fill="#334155">ETCD（1 或 3 节点）</text>
    <text x="317" y="162" font-size="10.5" fill="#334155">Redis 主从</text>
    <text x="317" y="184" font-size="10.5" fill="#334155">三台各跑一个 When 节点</text>
    <text x="317" y="206" font-size="10.5" fill="#334155">Nginx 做负载均衡</text>
    <text x="317" y="234" font-size="10.5" fill="#334155">环境变量指向 ETCD/Redis</text>
    <text x="317" y="270" font-size="10" fill="#94a3b8">部署文档详到每条命令，</text>
    <text x="317" y="286" font-size="10" fill="#94a3b8">新手半小时跑起来</text>

    <!-- K8s -->
    <rect x="575" y="65" width="260" height="240" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
    <text x="705" y="92" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">Kubernetes</text>
    <text x="705" y="112" font-size="10.5" fill="#64748b" text-anchor="middle">基础 yaml（不做 Operator）</text>
    <text x="592" y="140" font-size="10.5" fill="#334155">Deployment replicas=3</text>
    <text x="592" y="162" font-size="10.5" fill="#334155">Service 暴露 API</text>
    <text x="592" y="184" font-size="10.5" fill="#334155">ConfigMap / Secret</text>
    <text x="592" y="206" font-size="10.5" fill="#334155">liveness/readiness 探针（50）</text>
    <text x="592" y="228" font-size="10.5" fill="#334155">PodDisruptionBudget</text>
    <text x="592" y="270" font-size="10" fill="#94a3b8">ETCD/Redis 用现成 Helm chart</text>
    <text x="592" y="286" font-size="10" fill="#94a3b8">Operator 留社区共建</text>
  </g>

  <text x="20" y="336" font-family="Arial, sans-serif" font-size="11.5" fill="#64748b">配置全走环境变量（12-factor）；When 不绑定部署方式，只要 ETCD/Redis 的 endpoint 能访问即可。</text>
</svg>
