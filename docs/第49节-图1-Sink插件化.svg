<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 380" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="380" fill="#ffffff"/>
  <defs>
    <marker id="sk1-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="sk1-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
  </defs>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 1　生产到期处理器：加载多种 Sink，替换第 46 节测试到期处理</text>

  <!-- timewheel trigger -->
  <rect x="30" y="150" width="150" height="70" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="105" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">时间轮到期</text>
  <text x="105" y="202" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">调用 DueMessageHandler</text>

  <!-- dispatcher -->
  <rect x="240" y="150" width="160" height="70" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.6"/>
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">有界投递执行器</text>
  <text x="320" y="202" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">按 sink_type 选插件</text>

  <line x1="180" y1="185" x2="238" y2="185" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#sk1-amber)"/>

  <!-- Sink interface -->
  <rect x="460" y="70" width="150" height="60" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="535" y="96" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Sink 接口</text>
  <text x="535" y="116" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">（第 39 公共契约）</text>

  <!-- implementations -->
  <rect x="670" y="60" width="165" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="752" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">HTTP Sink</text>
  <rect x="670" y="120" width="165" height="50" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="752" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Kafka Sink</text>
  <rect x="670" y="180" width="165" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="752" y="210" font-family="Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">gRPC/RocketMQ…（后续）</text>

  <line x1="400" y1="180" x2="458" y2="110" stroke="#f59e0b" stroke-width="2" marker-end="url(#sk1-amber)"/>
  <line x1="610" y1="90" x2="668" y2="85" stroke="#22c55e" stroke-width="1.8" marker-end="url(#sk1-green)"/>
  <line x1="610" y1="105" x2="668" y2="140" stroke="#22c55e" stroke-width="1.8" marker-end="url(#sk1-green)"/>
  <line x1="610" y1="118" x2="668" y2="200" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#sk1-green)"/>

  <!-- SPI loader note -->
  <rect x="240" y="250" width="595" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="258" y="274" font-family="Arial, sans-serif" font-size="11.5" fill="#334155"><tspan font-weight="bold">SPI 加载：</tspan>META-INF/services 声明 → ServiceLoader 加载 → 注册成 type→Sink 的 Map。</text>
  <text x="258" y="296" font-family="Arial, sans-serif" font-size="11.5" fill="#334155">新增一种 Sink 只加一个实现 + 一行声明，不改 When 核心代码。</text>

  <text x="20" y="345" font-family="Arial, sans-serif" font-size="12" fill="#15803d">本节替换测试到期处理：取得投递权 → 真实 Sink → 更新最终状态 / 重新入轮。</text>
</svg>
