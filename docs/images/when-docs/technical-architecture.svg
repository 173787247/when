<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520">
  <rect width="860" height="520" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#f59e0b"/></marker></defs>
  <g font-family="Arial,'PingFang SC',sans-serif">
    <text x="20" y="30" font-size="15" font-weight="700" fill="#334155">When 整体架构：数据平面交付消息，控制平面管理时间轮</text>
    <rect x="28" y="70" width="130" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="93" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">业务系统</text><text x="93" y="114" text-anchor="middle" font-size="10.5" fill="#475569">HTTP API</text>
    <path d="M158 99H210" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="220" y="55" width="420" height="230" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="240" y="81" font-size="12" font-weight="700" fill="#334155">When 节点 × 3</text>
    <g font-size="11.5" text-anchor="middle"><rect x="245" y="100" width="108" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="299" y="129" fill="#1d4ed8">接入 + 路由</text><rect x="375" y="100" width="108" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text x="429" y="129" fill="#b45309">多层时间轮</text><rect x="505" y="100" width="108" height="48" rx="8" fill="#dcfce7" stroke="#22c55e"/><text x="559" y="129" fill="#15803d">Sink 投递</text><rect x="245" y="170" width="108" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="299" y="199" fill="#334155">副本同步</text><rect x="375" y="170" width="108" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="429" y="199" fill="#334155">集群客户端</text><rect x="505" y="170" width="108" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="559" y="199" fill="#334155">指标 + 日志</text></g>
    <path d="M353 124H375M483 124H505" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="260" y="240" width="340" height="28" rx="7" fill="#fff7ed" stroke="#f59e0b"/><text x="430" y="259" text-anchor="middle" font-size="10.5" fill="#b45309">每个时间轮：1 Master + 1 Slave，分布在不同节点</text>
    <path d="M640 120H700" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="710" y="70" width="120" height="58" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="770" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">目标系统</text><text x="770" y="114" text-anchor="middle" font-size="10.5" fill="#475569">HTTP / Kafka</text>
    <text x="28" y="334" font-size="12" font-weight="700" fill="#64748b">外部事实来源</text>
    <rect x="80" y="360" width="280" height="88" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="220" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Redis · 消息事实</text><text x="220" y="412" text-anchor="middle" font-size="11" fill="#475569">内容 · 状态 · 到期时间 · 重试信息</text><text x="220" y="431" text-anchor="middle" font-size="10.5" fill="#64748b">恢复内存时间轮的最终来源</text>
    <rect x="500" y="360" width="280" height="88" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="640" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">ETCD · 集群事实</text><text x="640" y="412" text-anchor="middle" font-size="11" fill="#475569">节点 · Controller · 时间轮分布 · epoch</text><text x="640" y="431" text-anchor="middle" font-size="10.5" fill="#64748b">选举、Watch 与权威决策</text>
    <path d="M330 285L250 360M530 285L610 360" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 5"/>
  </g>
</svg>
