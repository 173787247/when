<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440">
  <rect width="860" height="440" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#f59e0b"/></marker></defs>
  <g font-family="Arial,'PingFang SC',sans-serif">
    <text x="20" y="30" font-size="15" font-weight="700" fill="#334155">When 实施依赖图：两次运行，把分散模块收敛成完整系统</text>
    <rect x="35" y="70" width="220" height="90" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="145" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">阶段 A · 第 33～39 节</text><text x="145" y="118" text-anchor="middle" font-size="11.5" fill="#475569">认知 · 方案 · Harness · 验收</text><text x="145" y="138" text-anchor="middle" font-size="11.5" fill="#475569">确认领域模型与公共 SPI</text>
    <path d="M255 115H310" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="320" y="70" width="220" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="430" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">阶段 B · 第 40～46 节</text><text x="430" y="118" text-anchor="middle" font-size="11.5" fill="#475569">接口 · 存储 · 集群 · 时间轮 · 路由</text><text x="430" y="138" text-anchor="middle" font-size="11.5" fill="#475569">第一次跑：单机核心 + 集群基础</text>
    <path d="M540 115H595" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="605" y="70" width="220" height="90" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="715" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">阶段 C · 第 47～53 节</text><text x="715" y="118" text-anchor="middle" font-size="11.5" fill="#475569">副本 · Controller · Sink · 运维</text><text x="715" y="138" text-anchor="middle" font-size="11.5" fill="#475569">第二次跑：真投递 + 完整 HA</text>
    <text x="35" y="215" font-size="12" font-weight="700" fill="#64748b">模块级依赖</text>
    <g font-size="11" text-anchor="middle"><rect x="55" y="245" width="130" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="120" y="273" fill="#334155">公共契约</text><rect x="220" y="245" width="130" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="285" y="273" fill="#334155">Redis / ETCD</text><rect x="385" y="245" width="130" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="450" y="273" fill="#334155">时间轮 / 路由</text><rect x="550" y="245" width="130" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="615" y="273" fill="#334155">副本 / Controller</text><rect x="715" y="245" width="110" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8"/><text x="770" y="273" fill="#334155">Sink / 运维</text></g>
    <g stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"><path d="M185 268H220"/><path d="M350 268H385"/><path d="M515 268H550"/><path d="M680 268H715"/></g>
    <rect x="160" y="345" width="540" height="54" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="430" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">每个阶段的出口都是一次可运行、可判定的系统状态</text><text x="430" y="387" text-anchor="middle" font-size="11" fill="#64748b">问题回填原料后重跑，不在集成结果上堆补丁</text>
  </g>
