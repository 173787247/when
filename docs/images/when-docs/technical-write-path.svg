<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400">
  <rect width="860" height="400" fill="#fff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#f59e0b"/></marker></defs>
  <g font-family="Arial,'PingFang SC',sans-serif">
    <text x="20" y="30" font-size="15" font-weight="700" fill="#334155">消息写入链路：先建立可靠事实，再进入内存调度</text>
    <g font-size="11.5" text-anchor="middle">
      <rect x="25" y="75" width="110" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="80" y="99" font-weight="700" fill="#1d4ed8">① 校验</text><text x="80" y="118" fill="#475569">时间 / Sink / 载荷</text>
      <rect x="160" y="75" width="110" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="215" y="99" font-weight="700" fill="#1d4ed8">② 发号</text><text x="215" y="118" fill="#475569">message_id</text>
      <rect x="295" y="75" width="110" height="58" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="350" y="99" font-weight="700" fill="#1d4ed8">③ 路由</text><text x="350" y="118" fill="#475569">tw_id / Master</text>
      <rect x="430" y="75" width="110" height="58" rx="9" fill="#fee2e2" stroke="#ef4444" stroke-width="2.4"/><text x="485" y="99" font-weight="700" fill="#b91c1c">④ Redis</text><text x="485" y="118" fill="#475569">原子持久化</text>
      <rect x="565" y="75" width="110" height="58" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/><text x="620" y="99" font-weight="700" fill="#b45309">⑤ 入轮</text><text x="620" y="118" fill="#475569">Master + Slave</text>
      <rect x="700" y="75" width="135" height="58" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2.4"/><text x="768" y="99" font-weight="700" fill="#15803d">⑥ 返回成功</text><text x="768" y="118" fill="#475569">PENDING</text>
    </g>
    <g stroke="#f59e0b" stroke-width="2.2" marker-end="url(#a)"><path d="M135 104H160"/><path d="M270 104H295"/><path d="M405 104H430"/><path d="M540 104H565"/><path d="M675 104H700"/></g>
    <rect x="145" y="190" width="570" height="60" rx="11" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="430" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">不可违反的不变量</text><text x="430" y="238" text-anchor="middle" font-size="12" fill="#475569">Redis 未成功 → 不能入时间轮 → 不能返回成功</text>
    <rect x="145" y="290" width="570" height="60" rx="11" fill="#f8fafc" stroke="#94a3b8"/><text x="430" y="315" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">故障后的恢复路径</text><text x="430" y="337" text-anchor="middle" font-size="11.5" fill="#475569">Redis 中的 PENDING 消息 → 重建内存时间轮 → 节点就绪</text>
  </g>
</svg>
