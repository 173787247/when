<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="400" fill="#ffffff"/>
  <defs>
    <marker id="r2-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="r2-grey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 2　Controller 选举（原子 Txn）+ 上下线感知（Watch 事件驱动）</text>

  <!-- 选举 -->
  <text x="20" y="66" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309">① 选举：抢占式，只有一个成功</text>
  <rect x="30" y="80" width="150" height="50" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="105" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338ca" text-anchor="middle">node-1 / 2 / 3</text>
  <rect x="330" y="75" width="240" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="450" y="99" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#b45309" text-anchor="middle">Txn: if /when/controller 不存在</text>
  <text x="450" y="119" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">then Put = node_id, Lease</text>
  <line x1="180" y1="105" x2="328" y2="105" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#r2-amber)"/>
  <rect x="620" y="75" width="210" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="725" y="99" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#15803d" text-anchor="middle">成功者 = Controller</text>
  <text x="725" y="119" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">其余 Watch 等下次</text>
  <line x1="570" y1="105" x2="618" y2="105" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#r2-amber)"/>

  <line x1="30" y1="160" x2="830" y2="160" stroke="#e2e8f0" stroke-width="1.2"/>

  <!-- 感知 -->
  <text x="20" y="196" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309">② 上下线感知：Controller Watch /when/nodes/ 前缀</text>
  <rect x="30" y="215" width="180" height="70" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="120" y="245" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">Controller</text>
  <text x="120" y="266" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Watch /when/nodes/</text>

  <rect x="330" y="200" width="230" height="46" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="445" y="228" font-family="Arial, sans-serif" font-size="11.5" fill="#15803d" text-anchor="middle">PUT 事件：有新节点加入</text>
  <rect x="330" y="256" width="230" height="46" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="445" y="284" font-family="Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="middle">DELETE 事件：有节点下线</text>
  <line x1="210" y1="243" x2="328" y2="223" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#r2-grey)"/>
  <line x1="210" y1="258" x2="328" y2="279" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#r2-grey)"/>

  <rect x="620" y="200" width="210" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="725" y="228" font-family="Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">纳入新节点（后续可分配副本）</text>
  <rect x="620" y="256" width="210" height="46" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="725" y="278" font-family="Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">标记下线（切换属第八周）</text>
  <line x1="560" y1="223" x2="618" y2="223" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#r2-grey)"/>
  <line x1="560" y1="279" x2="618" y2="279" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#r2-grey)"/>

  <text x="20" y="340" font-family="Arial, sans-serif" font-size="12" fill="#64748b">把“主动探测”变成“事件驱动”：Controller 不轮询 ping 节点，只被动响应 ETCD 的事件流 —— 最简洁的做法。</text>
  <text x="20" y="362" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">本节到“感知 + 记录”为止；时间轮 Master/Slave 的真正切换与 rebalance 在第 47/48 节。</text>
</svg>
