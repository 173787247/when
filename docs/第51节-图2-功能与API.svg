<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="400" fill="#ffffff"/>
  <defs>
    <marker id="m2-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 2　管理台功能 ↔ admin HTTP API 映射</text>

  <!-- pages col -->
  <text x="140" y="66" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#4338ca" text-anchor="middle">页面 / 功能</text>
  <text x="640" y="66" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">admin HTTP API</text>

  <g font-family="Arial, sans-serif">
    <rect x="30" y="80" width="220" height="52" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="140" y="104" font-size="11.5" font-weight="bold" fill="#4338ca" text-anchor="middle">查看时间轮</text>
    <text x="140" y="122" font-size="9.5" fill="#64748b" text-anchor="middle">Master/Slave/状态/消息数</text>
    <rect x="430" y="80" width="400" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="110" font-size="11.5" fill="#b45309">GET /admin/v1/timewheels</text>

    <rect x="30" y="146" width="220" height="52" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="140" y="170" font-size="11.5" font-weight="bold" fill="#4338ca" text-anchor="middle">创建时间轮</text>
    <text x="140" y="188" font-size="9.5" fill="#64748b" text-anchor="middle">→ Controller 分配 M/S</text>
    <rect x="430" y="146" width="400" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="170" font-size="11.5" fill="#b45309">POST /admin/v1/timewheels</text>
    <text x="450" y="188" font-size="9.5" fill="#64748b">Idempotency-Key + body:{count}</text>

    <rect x="30" y="212" width="220" height="52" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="140" y="236" font-size="11.5" font-weight="bold" fill="#4338ca" text-anchor="middle">查看延时消息（列表）</text>
    <text x="140" y="254" font-size="9.5" fill="#64748b" text-anchor="middle">按状态/标签/时间筛选</text>
    <rect x="430" y="212" width="400" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="242" font-size="11.5" fill="#b45309">GET /admin/v1/messages?status=&amp;tag=</text>

    <rect x="30" y="278" width="220" height="52" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="140" y="302" font-size="11.5" font-weight="bold" fill="#4338ca" text-anchor="middle">消息详情 / 投递日志</text>
    <text x="140" y="320" font-size="9.5" fill="#64748b" text-anchor="middle">状态时间线、重试记录</text>
    <rect x="430" y="278" width="400" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="308" font-size="11.5" fill="#b45309">GET /admin/v1/messages/{id}</text>

    <rect x="30" y="344" width="220" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="140" y="371" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle">集群节点</text>
    <rect x="430" y="344" width="400" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="450" y="371" font-size="11.5" fill="#475569">GET /admin/v1/cluster/nodes</text>
  </g>

  <line x1="250" y1="106" x2="428" y2="106" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#m2-amber)"/>
  <line x1="250" y1="172" x2="428" y2="172" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#m2-amber)"/>
  <line x1="250" y1="238" x2="428" y2="238" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#m2-amber)"/>
  <line x1="250" y1="304" x2="428" y2="304" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#m2-amber)"/>
  <line x1="250" y1="366" x2="428" y2="366" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m2-amber)"/>
</svg>
