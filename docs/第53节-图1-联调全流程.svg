<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="400" fill="#ffffff"/>
  <defs>
    <marker id="j1-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
  </defs>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 1　完整 HA 联调：部署 → 消息操作 → 管理台 → 故障切换</text>

  <g font-family="Arial, sans-serif">
    <rect x="30" y="70" width="180" height="76" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="120" y="98" font-size="12.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">① 自动部署集群</text>
    <text x="120" y="120" font-size="10" fill="#64748b" text-anchor="middle">docker-compose / K8s（52）</text>
    <text x="120" y="137" font-size="10" fill="#64748b" text-anchor="middle">3 节点 + ETCD/Redis/Kafka</text>

    <rect x="250" y="70" width="180" height="76" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="340" y="98" font-size="12.5" font-weight="bold" fill="#15803d" text-anchor="middle">② 验证消息操作</text>
    <text x="340" y="120" font-size="10" fill="#64748b" text-anchor="middle">提交 / 查询 / 取消消息</text>
    <text x="340" y="137" font-size="10" fill="#64748b" text-anchor="middle">真实 Sink 投到 HTTP/Kafka（49）</text>

    <rect x="470" y="70" width="180" height="76" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="560" y="98" font-size="12.5" font-weight="bold" fill="#4338ca" text-anchor="middle">③ 验证管理台</text>
    <text x="560" y="120" font-size="10" fill="#64748b" text-anchor="middle">查看/创建时间轮（51）</text>
    <text x="560" y="137" font-size="10" fill="#64748b" text-anchor="middle">验证 PENDING→DELIVERED</text>

    <rect x="690" y="70" width="145" height="76" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
    <text x="762" y="98" font-size="12.5" font-weight="bold" fill="#b45309" text-anchor="middle">④ 验证 HA</text>
    <text x="762" y="120" font-size="10" fill="#64748b" text-anchor="middle">停止 Master 节点</text>
    <text x="762" y="137" font-size="10" fill="#64748b" text-anchor="middle">10s 内切换并恢复消息</text>
  </g>

  <line x1="210" y1="108" x2="248" y2="108" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#j1-amber)"/>
  <line x1="430" y1="108" x2="468" y2="108" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#j1-amber)"/>
  <line x1="650" y1="108" x2="688" y2="108" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#j1-amber)"/>

  <!-- what's now real -->
  <rect x="30" y="185" width="805" height="90" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="48" y="210" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#15803d">相比第 46 节，本次增加的能力：</text>
  <text x="48" y="234" font-family="Arial, sans-serif" font-size="11" fill="#334155">测试 Sink → HTTP/Kafka 真实投递（49）　·　单副本 → Master/Slave + 10 秒切换（47）　·　静态分布 → Controller 动态 rebalance（48）</text>
  <text x="48" y="256" font-family="Arial, sans-serif" font-size="11" fill="#334155">增加指标/日志/健康检查（50）　·　自动部署（52）　·　可查询和操作的管理台（51）</text>

  <!-- backfill -->
  <rect x="30" y="295" width="805" height="76" rx="10" fill="#fef7ed" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="48" y="320" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#b45309">发现规格问题：修改对应任务文档，再从干净状态执行</text>
  <text x="48" y="344" font-family="Arial, sans-serif" font-size="11" fill="#334155">切换超时→47　·　分布不均→48　·　投递失败→49　·　缺少观测→50　·　页面错误→51　·　部署失败→52</text>
  <text x="48" y="363" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b">全部验收通过后，形成可部署、可观测并具备节点故障恢复能力的 When。</text>
</svg>
