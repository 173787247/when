<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="860" height="300" fill="#ffffff"/>
  <defs>
    <marker id="st-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/></marker>
    <marker id="st-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"/></marker>
    <marker id="st-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
  </defs>
  <text x="20" y="30" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">图 2　消息状态机（与第 39 节公共契约 MessageStatus 一致）</text>

  <rect x="30" y="120" width="130" height="52" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.4"/>
  <text x="95" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">PENDING</text>

  <rect x="260" y="120" width="140" height="52" rx="9" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="330" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">DELIVERING</text>

  <rect x="510" y="60" width="140" height="52" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="580" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">DELIVERED</text>

  <rect x="510" y="180" width="140" height="52" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="580" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">FAILED</text>

  <rect x="30" y="220" width="130" height="52" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="95" y="252" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">CANCELLED</text>

  <!-- transitions -->
  <line x1="160" y1="146" x2="258" y2="146" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#st-amber)"/>
  <text x="175" y="138" font-family="Arial, sans-serif" font-size="10.5" fill="#b45309">到期触发</text>

  <line x1="400" y1="135" x2="508" y2="95" stroke="#22c55e" stroke-width="2.2" marker-end="url(#st-green)"/>
  <text x="410" y="110" font-family="Arial, sans-serif" font-size="10.5" fill="#15803d">投递成功</text>

  <line x1="400" y1="158" x2="508" y2="198" stroke="#c0392b" stroke-width="2.2" marker-end="url(#st-red)"/>
  <text x="410" y="192" font-family="Arial, sans-serif" font-size="10.5" fill="#c0392b">重试耗尽</text>

  <line x1="95" y1="172" x2="95" y2="218" stroke="#94a3b8" stroke-width="2" marker-end="url(#st-red)"/>
  <text x="105" y="200" font-family="Arial, sans-serif" font-size="10.5" fill="#475569">投递前取消</text>

  <text x="20" y="292" font-family="Arial, sans-serif" font-size="11.5" fill="#64748b">查询/取消都靠 message_id 一致性 hash 定位到同一个时间轮；已 DELIVERING/DELIVERED 的取消不了。</text>
</svg>
